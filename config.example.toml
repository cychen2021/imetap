# imetap configuration. Every key is optional; the values below are the defaults.
# Restart imetap after editing (`imetap restart`).

[tap]
# Double-tap Ctrl to toggle Chinese/English; triple-tap it to show the HUD without changing anything.
enabled = true
# Longest time between the two taps, in milliseconds.
gap_ms = 500
# Longest time Ctrl may be held for a press to count as a tap, in milliseconds.
hold_ms = 300
# How long to wait after a double tap for a third tap, in milliseconds. The toggle waits this long
# too; 0 turns triple taps off, so the toggle is immediate.
triple_ms = 300
# Hold back the keys typed while a double tap is being applied (including the wait for a third tap)
# and replay them afterwards, so that they reach the application in the new mode. Windows only.
hold_input = true

[hotkeys]
# Global hotkeys that switch the input method. An empty string disables one.
us = "Ctrl+Shift+S"
# Microsoft Pinyin on Windows, Shuangpin on macOS.
chinese = "Ctrl+Shift+F"
doubao = "Ctrl+Shift+D"

[hud]
enabled = true
# Also show the HUD when switching to a window whose input method or mode differs.
on_window_switch = true
# With on_window_switch, wait until focus is in a text field before showing the HUD, so that merely
# passing through windows does not flash it. Windows only; where the focus cannot be told, it shows.
wait_for_text_field = true
# How long it stays fully visible, in milliseconds.
duration_ms = 1500
# How long it takes to fade in and to fade out, in milliseconds; 0 for none.
fade_in_ms = 350
fade_out_ms = 250
# 0.05 (almost invisible) to 1.0 (opaque).
opacity = 0.85

[hud.colors]
# Background by mode. Colour names: red, orange, green, teal, blue, purple, pink, brown, grey, black.
chinese = "red"
english = "blue"

[hud.ime_colors]
# The stripe on the left edge of the HUD, one colour per input method. An input method without a
# Chinese/English mode ("other", i.e. one imetap does not know) also gets it as the background.
# An input method imetap does not know but the system names (Hiragana, Dvorak, ...) gets a label and
# a colour derived from that name instead, so "other" only applies when there is no name.
us = "grey"
pinyin = "green"
doubao = "orange"
shuangpin = "teal"
other = "purple"

[hud.ime_labels]
# The big label on the stripe, one or two characters per input method.
us = "US"
pinyin = "微"
doubao = "豆"
shuangpin = "双"
other = "其"

[reminder]
# Show the HUD again when the input method may have been forgotten.
enabled = false
# "resume": when you come back after the computer sat idle (no key, mouse or focus-window activity).
# "resume-and-switch": also when you leave a window you used for `dwell_secs` or longer without the
# HUD appearing, even if the next window has the same input method.
mode = "resume"
# How long without activity counts as idle, in seconds.
idle_secs = 300
# How long a window must have been used, in seconds (resume-and-switch only).
dwell_secs = 300
